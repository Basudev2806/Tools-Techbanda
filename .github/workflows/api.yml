name: API — build & push

# Runs only when something under server/ changes, so a client-only commit
# never touches this image. workflow_dispatch lets you trigger it manually
# too (e.g. after a base-image security update with no code change).
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tools-techbanda-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy step — disabled until you have a Docker-capable host (Business
      # hosting can't run containers; this needs a VPS or similar). Once you
      # do: add DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY as repo secrets,
      # point compose-path at wherever docker-compose.yml lives on that host,
      # and flip `if: false` to `if: true`.
      - name: Deploy to host (disabled — see comment above)
        if: false
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE }}:latest
            docker compose -f /path/to/tools-techbanda/docker-compose.yml up -d api
